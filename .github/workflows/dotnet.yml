# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build PR

on:
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check formatting with Csharpier
        run: |
          dotnet tool restore
          dotnet csharpier check src/ test/ tools/
      - name: Restore dependencies
        run: dotnet restore MangaIngestWithUpscaling.sln
      - name: Build
        run: dotnet build --no-restore MangaIngestWithUpscaling.sln /warnaserror
      - name: Test (Unit Tests Only)
        run: dotnet test --no-build --verbosity normal --solution MangaIngestWithUpscaling.sln --filter-not-trait Category=Download
      - name: Test against PostgreSQL (Testcontainers)
        env:
          TEST_DB_PROVIDER: postgres
        run: dotnet test --no-build --verbosity normal --project test/MangaIngestWithUpscaling.Tests/MangaIngestWithUpscaling.Tests.csproj --filter-not-trait Category=Download
      - name: Test UI against PostgreSQL (Testcontainers)
        env:
          TEST_DB_PROVIDER: postgres
        run: dotnet test --no-build --verbosity normal --project test/MangaIngestWithUpscaling.Tests.UI/MangaIngestWithUpscaling.Tests.UI.csproj --filter-not-trait Category=Download

  # The images are only built by the release workflows, which run after the merge — so a Dockerfile
  # that no longer copies, restores or publishes is first noticed when a release is cut. The migration
  # rewrote both of them (the app image now also carries the migrator, the worker's copy list and its
  # base stage changed), so the two CPU images are built on every PR.
  #
  # The CUDA images are deliberately not built (a multi-gigabyte base pull on every PR, and the release
  # workflows build them anyway) but their base tag is resolved: a retired or mistyped nvidia/cuda tag
  # is the failure that would otherwise only surface in a release. Only their build and publish stages
  # resemble the CPU images'; their runtime stage is a different base (nvidia/cuda with the .NET
  # runtime copied in and a CUDA-defaulting PreferredGpuBackend), so a break there is not covered by
  # the CPU builds above.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
      - name: Build the remote worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MangaIngestWithUpscaling.RemoteWorker/Dockerfile
          push: false
      # The Compose image. This one is built by neither CI nor the release workflows (only
      # docker-compose.yml uses it), yet this migration rewrote it — the Python removal, the Vulkan
      # packages, PreferredGpuBackend=WebGPU, the migrator publish that now overlaps the app's
      # dependencies — so `docker compose up` was the first thing to find out whether it still builds.
      - name: Build the Compose image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MangaIngestWithUpscaling/Dockerfile
          push: false
      # The core service lives in the `default` profile and Compose never auto-enables a profile, so
      # the tracked `.env` (COMPOSE_PROFILES=default) is what makes a plain `docker compose up` start
      # it. Untracking that file once already left a fresh clone running only kavita while the header
      # comment still promised otherwise; the image builds above cannot see a service-selection
      # regression, so assert the selection here instead of leaving it to a user to discover.
      - name: Verify the Compose service selection
        run: |
          set -euo pipefail
          echo "plain: $(docker compose config --services | sort | tr '\n' ' ')"
          docker compose config --services | grep -qx mangaingestwithupscaling || {
            echo "::error::plain 'docker compose up' would not start the app service — is .env still tracked, and does it still set COMPOSE_PROFILES=default?"
            exit 1
          }
          if docker compose --profile remote-only config --services | grep -qx mangaingestwithupscaling; then
            echo "::error::'--profile remote-only' must exclude the standard app service"
            exit 1
          fi
      - name: Verify the CUDA base tag resolves
        run: docker manifest inspect nvidia/cuda:13.4.2-cudnn-runtime-ubuntu24.04 > /dev/null
