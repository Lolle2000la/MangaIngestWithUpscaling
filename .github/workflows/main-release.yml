name: Build and Publish Development Docker Image

on:
  workflow_dispatch: 
  workflow_run: 
    workflows: [".NET Build Main"]
    branches: 
      - main
    types:
      - completed

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.settag.outputs.tag }}
    steps:
      - name: Generate timestamp tag
        id: settag
        run: |
          # Format: YYYYMMDDHHMMSS in UTC
          TAG=$(date -u +"%Y%m%d%H%M%S")
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"
  build-and-push-x86:
    permissions: 
      contents: read
      packages: write 
    runs-on: ubuntu-latest
    needs: [generate-tag]
    env:
      IMAGE_NAME: manga-ingest-with-upscaling
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ needs.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 
      - name: Set owner to lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CPU Docker image (AMD64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-amd64,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest-dev-amd64

  build-and-push-cuda-x86:
    permissions: 
      contents: read
      packages: write 
    runs-on: ubuntu-latest
    needs: [generate-tag]
    env:
      IMAGE_NAME: manga-ingest-with-upscaling
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ needs.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 
      - name: Set owner to lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CUDA Docker image (AMD64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cuda.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-cuda-amd64,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest-dev-cuda-amd64

  build-and-push-openvino-x86:
    permissions: 
      contents: read
      packages: write 
    runs-on: ubuntu-latest
    needs: [generate-tag]
    env:
      IMAGE_NAME: manga-ingest-with-upscaling
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ needs.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 
      - name: Set owner to lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Intel OpenVINO Docker image (AMD64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: openvino.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-openvino-amd64,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest-dev-openvino-amd64,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-xpu-amd64,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest-dev-xpu-amd64
          platforms: linux/amd64

  build-and-push-rocm-x86:
    permissions: 
      contents: read
      packages: write 
    runs-on: ubuntu-latest
    needs: [generate-tag]
    env:
      IMAGE_NAME: manga-ingest-with-upscaling
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ needs.generate-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7 
      - name: Set owner to lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ROCm Docker image (AMD64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: rocm.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}-rocm-amd64,${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest-dev-rocm-amd64
          platforms: linux/amd64

  create-manifest:
    permissions: 
      contents: read
      packages: write 
    runs-on: ubuntu-latest
    needs: [build-and-push-x86, build-and-push-cuda-x86, build-and-push-openvino-x86, build-and-push-rocm-x86, generate-tag]
    env:
      IMAGE_NAME: manga-ingest-with-upscaling
      REGISTRY: ghcr.io
      OWNER: ${{ github.repository_owner }}
      TAG: ${{ needs.generate-tag.outputs.tag }}
    steps:
      - name: Set owner to lowercase
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest for main image (CPU default)
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t "$IMAGE:${{ env.TAG }}" -t "$IMAGE:latest-dev" \
            "$IMAGE:${{ env.TAG }}-amd64"

      - name: Create and push multi-arch manifest for CUDA image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t "$IMAGE:${{ env.TAG }}-cuda" -t "$IMAGE:latest-dev-cuda" \
            "$IMAGE:${{ env.TAG }}-cuda-amd64"

      - name: Create and push multi-arch manifest for OpenVINO image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t "$IMAGE:${{ env.TAG }}-openvino" -t "$IMAGE:latest-dev-openvino" \
            -t "$IMAGE:${{ env.TAG }}-xpu" -t "$IMAGE:latest-dev-xpu" \
            "$IMAGE:${{ env.TAG }}-openvino-amd64"

      - name: Create and push multi-arch manifest for ROCm image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create -t "$IMAGE:${{ env.TAG }}-rocm" -t "$IMAGE:latest-dev-rocm" \
            "$IMAGE:${{ env.TAG }}-rocm-amd64"
