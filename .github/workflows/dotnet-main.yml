# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET Build Main

on:
  push:
    branches: ["main"]
    paths:
      - "src/MangaIngestWithUpscaling/**"
      - "src/MangaIngestWithUpscaling.Shared/**"
      - "src/MangaIngestWithUpscaling.Data/**"
      - "src/MangaIngestWithUpscaling.Data.Sqlite/**"
      - "src/MangaIngestWithUpscaling.Data.Postgres/**"
      - "src/MangaIngestWithUpscaling.RemoteWorker/**"
      - "test/MangaIngestWithUpscaling.Tests/**"
      - "test/MangaIngestWithUpscaling.Tests.UI/**"
      - "test/MangaIngestWithUpscaling.Shared.Tests/**"
      - "test/MangaIngestWithUpscaling.RemoteWorker.Tests/**"
      - "tools/MangaIngestWithUpscaling.DbMigrator/**"
      - "scripts/**"
      - "MangaIngestWithUpscaling.sln"
      - "docker-compose.yml"
      - "Dockerfile"
      - "rocm.Dockerfile"
      - "remoteonly.Dockerfile"
      - "cuda128.Dockerfile"
      - "xpu.Dockerfile"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore MangaIngestWithUpscaling.sln
      - name: Build
        run: dotnet build --no-restore MangaIngestWithUpscaling.sln /warnaserror
      - name: Test shared
        run: dotnet test --no-build --verbosity normal --project test/MangaIngestWithUpscaling.Shared.Tests/MangaIngestWithUpscaling.Shared.Tests.csproj --filter-not-trait Category=Download
      # The SQLite steps run the full suite, including the slow Category=Download tests; the
      # PostgreSQL passes skip them because a download test does not depend on the database provider.
      - name: Test server
        run: dotnet test --no-build --verbosity normal --project test/MangaIngestWithUpscaling.Tests/MangaIngestWithUpscaling.Tests.csproj
      - name: Test server against PostgreSQL (Testcontainers)
        env:
          TEST_DB_PROVIDER: postgres
        run: dotnet test --no-build --verbosity normal --project test/MangaIngestWithUpscaling.Tests/MangaIngestWithUpscaling.Tests.csproj --filter-not-trait Category=Download
      - name: Test server UI
        run: dotnet test --no-build --verbosity normal --project test/MangaIngestWithUpscaling.Tests.UI/MangaIngestWithUpscaling.Tests.UI.csproj
      - name: Test server UI against PostgreSQL (Testcontainers)
        env:
          TEST_DB_PROVIDER: postgres
        run: dotnet test --no-build --verbosity normal --project test/MangaIngestWithUpscaling.Tests.UI/MangaIngestWithUpscaling.Tests.UI.csproj --filter-not-trait Category=Download
