syntax = "proto3";

import "google/protobuf/empty.proto";

package manga_ingest_with_upscaling.api.upscaling;

message UpscaleTaskDelegationResponse {
  int32 task_id = 1; // Task ID of the upscaling task, -1 if none available
  optional UpscalerProfile upscaler_profile = 2; // JSON string of the upscaling configuration used by MangaJaNaiUpscalerGui-cli tool, needs editing.
  TaskType task_type = 3;
  optional int64 input_size_bytes = 5; // Size of the input the worker will transfer (the source CBZ, or the prepared repair CBZ), for bandwidth-aware prefetch timing
}

// Non-claiming peek at the head of the upscale queue, so a worker can decide whether to claim
// (and start downloading) based on the transfer size before it commits to the task.
message PeekNextTaskResponse {
  int32 task_id = 1; // Task ID of the next upscale task, -1 if none available
  optional int64 input_size_bytes = 2; // Size of the source CBZ
}

enum TaskType {
  UPSCALE = 0;
  SPLIT_DETECTION = 1;
}

message UploadDetectionResultResponse {
  bool success = 1;
  string message = 2;
  // True for a deterministic failure that should fail the task; false means "restart the chapter"
  // (for example the content or engine changed, or the request hit a replica without the spool).
  bool terminal = 3;
}

// Backward-compatible request with optional hints
message RequestTaskRequest {
  optional bool prefetch = 1; // If true, this request is a prefetch reservation
}

message KeepAliveRequest {
  // Keep alive request to keep the connection open, needs to be sent every minute
  int32 task_id = 1; // Task ID of the upscaling task
  // Optional live progress info (backward compatible):
  optional int32 total = 2;           // Total items to process
  optional int32 current = 3;         // Items processed so far
  optional string status_message = 4; // Short status text for UI
  optional string phase = 5;          // Current phase name
  optional bool prefetch = 6;         // If true, keep-alive belongs to a prefetched reservation
}

message KeepAliveResponse {
  bool is_alive = 1; // True if the connection is still alive
}

message CheckConnectionResponse {
  bool success = 1; // True if the connection is successful
  string message = 2; // Message from the server
}

message ReportTaskFailedRequest {
  int32 task_id = 1;
  optional string error_message = 2;
}

// ---------------------------------------------------------------------------
// Page streaming
//
// Instead of transferring whole CBZ files, a worker fetches a chapter's source
// pages one at a time and uploads each upscaled page as it finishes. The server
// spools the results and assembles the final CBZ, so a dropped connection only
// loses the in-flight pages and a re-dispatched task resumes where it left off.
// ---------------------------------------------------------------------------

message PageDescriptor {
  int32 index = 1; // Ordinal of the page in the source archive.
  string source_name = 2; // Entry name in the source, e.g. "005.jpg".
  string output_name = 3; // Entry name to write, e.g. "005.webp".
}

message PageManifestRequest {
  int32 task_id = 1;
  // Opaque identity of the engine (models + preprocessing) that will produce the pages. The server
  // records it and refuses to mix pages produced by different engines into one chapter.
  string engine_identity = 2;
}

message PageManifestResponse {
  int32 task_id = 1;
  // Identity of (source + profile). Changes invalidate spooled pages. The engine identity is sent
  // separately and validated against it.
  string task_identity = 2;
  TaskType task_type = 3;
  repeated PageDescriptor pages = 4;
  repeated int32 completed_pages = 5; // Pages already spooled on the server.
  optional UpscalerProfile upscaler_profile = 6;
  // True when every page was already spooled; the server assembled the chapter and the worker has
  // nothing to do.
  bool complete = 7;
  // Largest page (in pixels) in the source archive, so the worker can scale its inactivity timeout
  // the same way the local upscaler does. 0 when unknown.
  int64 max_page_pixels = 8;
}

message GetPagesRequest {
  int32 task_id = 1;
  string task_identity = 2;
  repeated int32 page_indexes = 3; // Pages to fetch (the ones still missing).
}

message PageChunk {
  int32 task_id = 1;
  int32 page_index = 2;
  int32 chunk_number = 3;
  bytes chunk = 4;
  bool is_last = 5;
  string content_identity = 6;
}

message UploadPageChunk {
  int32 task_id = 1;
  int32 page_index = 2;
  int32 chunk_number = 3;
  bytes chunk = 4;
  bool is_last = 5;
  string content_identity = 6;
  // Engine that produced the page; the server rejects a page whose engine differs from the one the
  // chapter is being spooled with.
  string engine_identity = 7;
}

message UploadPageResponse {
  bool success = 1;
  string message = 2;
  int32 task_id = 3;
  int32 page_index = 4;
  bool terminal = 5;
}

message UploadPageDetectionRequest {
  int32 task_id = 1;
  int32 page_index = 2;
  string result_json = 3; // JSON of one SplitDetectionResult for the page.
  // Identity the results were produced against; the server rejects results for a stale identity.
  string task_identity = 4;
  // Detector engine that produced the result; the server rejects results from a different engine.
  string engine_identity = 5;
}

service UpscalingService {
  // Request a task to be upscaled
  rpc RequestUpscaleTask(google.protobuf.Empty) returns (UpscaleTaskDelegationResponse);
  // New method accepting hints (e.g., prefetch). Older clients use RequestUpscaleTask.
  rpc RequestUpscaleTaskWithHint(RequestTaskRequest) returns (UpscaleTaskDelegationResponse);
  // Peek at the next upscale task without claiming it, so workers can time their claim.
  rpc PeekNextTask(google.protobuf.Empty) returns (PeekNextTaskResponse);
  rpc KeepAlive(KeepAliveRequest) returns (KeepAliveResponse);
  rpc CheckConnection(google.protobuf.Empty) returns (CheckConnectionResponse);
  rpc ReportTaskFailed(ReportTaskFailedRequest) returns (google.protobuf.Empty);
  // Page streaming: manifest, source pages, and per-page result uploads.
  rpc GetPageManifest(PageManifestRequest) returns (PageManifestResponse);
  rpc GetPages(GetPagesRequest) returns (stream PageChunk);
  rpc UploadPage(stream UploadPageChunk) returns (UploadPageResponse);
  rpc UploadPageDetection(UploadPageDetectionRequest) returns (UploadDetectionResultResponse);
}

// Represents a preconfigured upscaler setting that can be associated with chapters.
message UpscalerProfile {
  string name = 1;
  UpscalerMethod upscaler_method = 2;
  ScaleFactor scaling_factor = 3;
  CompressionFormat compression_format = 4;
  int32 quality = 5; // Must be between 1 and 100, validation should be handled in application logic.
}

// Enum representing the upscaler method.
enum UpscalerMethod {
  UPSCALER_METHOD_UNSPECIFIED = 0;
  MANGA_JA_NAI = 1;
}

// Possible upscaling factors for chapters.
enum ScaleFactor {
  SCALE_FACTOR_UNSPECIFIED = 0;
  ONE_X = 1;
  TWO_X = 2;
  THREE_X = 3;
  FOUR_X = 4;
}

// Possible compression formats when a chapter is upscaled.
enum CompressionFormat {
  COMPRESSION_FORMAT_UNSPECIFIED = 0;
  AVIF = 1;
  PNG = 2;
  WEBP = 3;
  JPG = 4;
}
